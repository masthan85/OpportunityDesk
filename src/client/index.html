<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6fa"><title>Opportunity Desk</title><link rel="stylesheet" href="/style.css"><script src="/workspace.js" defer></script></head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><span class="mark" aria-hidden="true">✳</span><div>Opportunity Desk<small>DATA &amp; AI</small></div></div>
  <nav id="navigation" aria-label="Workspace views"></nav>
  <div class="sidebar-foot"><span class="status-dot"></span> Private workspace · <a target="_top" href="/signout-with-chatgpt?return_to=%2F">Sign out</a></div>
</aside>
<main>
  <header class="top"><div class="breadcrumb"><strong>Workspace</strong><span> / </span><span id="crumb">Overview</span></div><button class="primary" id="add"><span aria-hidden="true">＋</span> Add opportunity</button></header>
  <div id="view" aria-busy="true"><p class="loading">Loading workspace…</p></div>
</main>
</div>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><header class="dialog-head"><div><div class="eyebrow">OPPORTUNITY DESK</div><h2 id="editor-title"></h2></div><button type="button" class="icon-button" id="close" aria-label="Close">×</button></header><div id="fields"></div><p id="form-error" role="alert"></p><footer class="dialog-foot"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary" id="save">Save changes</button></footer></form></dialog>
<div id="notice" role="status" aria-live="polite"></div>
</body></html>
